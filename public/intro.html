<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Velora</title>
<meta name="theme-color" content="#000000">
<link rel="preload" href="/media/velora-site-intro.mp4" as="video" type="video/mp4">
<link rel="preload" href="/media/velora-site-intro-poster.jpg" as="image">
<link rel="preload" href="/assets/index-BfbMXOly.css" as="style">
<link rel="modulepreload" href="/assets/index-BTzUZ7Xu.js">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{font-family:Arial,sans-serif}
#intro{position:fixed;inset:0;background:#050505 url('/media/velora-site-intro-poster.jpg') center/cover no-repeat;opacity:1;transition:opacity .24s ease}
#intro.out{opacity:0}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:transparent}
.track{position:absolute;left:50%;bottom:max(34px,4.5vh);width:min(300px,48vw);height:2px;transform:translateX(-50%);border-radius:999px;background:rgba(255,255,255,.13);overflow:hidden}
.track i{display:block;width:2%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#781022,#ef1d43,#ff6b80);box-shadow:0 0 12px rgba(239,29,67,.5);transition:width .08s linear}
</style>
</head>
<body>
<div id="intro" aria-hidden="true">
  <video id="introVideo" muted autoplay playsinline preload="auto" poster="/media/velora-site-intro-poster.jpg" disablepictureinpicture>
    <source src="/media/velora-site-intro.mp4" type="video/mp4">
  </video>
  <div class="track"><i></i></div>
</div>
<script>
(() => {
  const v = document.getElementById('introVideo');
  const root = document.getElementById('intro');
  const bar = document.querySelector('.track i');
  let done = false;
  const go = () => {
    if (done) return;
    done = true;
    root.classList.add('out');
    setTimeout(() => location.replace('/app'), 220);
  };
  const progress = () => {
    if (Number.isFinite(v.duration) && v.duration > 0) {
      bar.style.width = `${Math.max(2, Math.min(100, (v.currentTime / v.duration) * 100))}%`;
    }
  };
  v.addEventListener('timeupdate', progress);
  v.addEventListener('ended', go, { once: true });
  v.addEventListener('error', go, { once: true });
  v.addEventListener('abort', go, { once: true });
  v.muted = true; v.defaultMuted = true; v.playsInline = true;
  const p = v.play();
  p?.catch?.(() => setTimeout(go, 250));
  // Crash protection only. The encoded clip is ~4.04s.
  setTimeout(go, 4700);
  // Warm the catalog while the intro is playing without blocking anything.
  fetch('/api/catalog', { cache: 'no-store' }).catch(() => {});
})();
</script>
</body>
</html>
