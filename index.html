<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050506" />
    <meta name="description" content="Noctra — a cinematic, mobile-first destination for movies and series." />
    <title>Noctra — Movies & Series</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      [hidden] { display: none !important; }
      .home-view { min-height: 100vh; }
      .poster-fallback { position:absolute; inset:0; display:grid; place-items:center; padding:24px; color:#eee; font-weight:800; text-align:center; }
      .browse-view { padding-top:112px; }
      .catalog-status { min-height:24px; margin:14px 0 4px; color:#aaa; font-size:.92rem; }
      .catalog-status.is-loading::before { content:""; display:inline-block; width:10px; height:10px; margin-right:8px; border:2px solid #666; border-top-color:#fff; border-radius:50%; animation:catalog-spin .8s linear infinite; }
      .load-more-wrap { display:flex; justify-content:center; padding:28px 0 110px; }
      #load-more { min-width:150px; }
      @keyframes catalog-spin { to { transform:rotate(360deg); } }
    </style>
  </head>
  <body>
    <main>
      <header class="topbar">
        <button class="brand" type="button" data-tab="home" aria-label="Noctra home">NOCTRA</button>
        <nav class="desktop-nav" aria-label="Primary navigation">
          <button class="active" data-tab="home">Home</button>
          <button data-tab="movies">Movies</button>
          <button data-tab="tv">Series</button>
          <button data-tab="list">My List</button>
        </nav>
        <div class="top-actions">
          <button class="icon-button search-button" type="button" aria-label="Search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.2 4.2"></path></svg>
          </button>
          <span class="profile" aria-label="Profile">N</span>
        </div>
      </header>

      <div class="home-view">
        <section class="hero" id="hero">
          <div class="hero-scrim"></div>
          <div class="hero-content">
            <div class="eyebrow"><span>N</span> NOCTRA FEATURE</div>
            <h1>DUNE<br /><em>PART TWO</em></h1>
            <div class="hero-meta"><strong>98% Match</strong><span>2024</span><span>PG-13</span><span>2h 46m</span></div>
            <p>Paul Atreides unites with Chani and the Fremen while seeking revenge against the conspirators who destroyed his family.</p>
            <div class="hero-actions">
              <button class="primary-button" type="button" id="hero-play"><span class="play-triangle" aria-hidden="true"></span> Play</button>
              <button class="secondary-button" type="button" id="hero-list">+ My List</button>
            </div>
          </div>
        </section>
        <section class="content-rows" id="content-rows" aria-label="Featured titles"></section>
      </div>

      <section class="browse-view" hidden aria-label="Browse catalog">
        <div class="browse-heading">
          <p id="browse-title">Search</p>
          <label class="search-field">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.2 4.2"></path></svg>
            <input id="search-input" placeholder="Titles, genres, or years" aria-label="Search titles, genres, or years" autocomplete="off" />
            <button type="button" id="clear-search" aria-label="Clear search" hidden>×</button>
          </label>
        </div>
        <p class="catalog-status" id="catalog-status" aria-live="polite"></p>
        <div class="catalog-grid" id="catalog-grid"></div>
        <div class="empty-state" id="empty-state" hidden>
          <span>NO RESULTS</span><h1 id="empty-title">Nothing found.</h1><p id="empty-copy">Try another title or genre.</p>
        </div>
        <div class="load-more-wrap"><button class="secondary-button" type="button" id="load-more" hidden>Load more</button></div>
      </section>

      <nav class="mobile-nav" aria-label="Mobile navigation">
        <button class="active" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8"></path><path d="M5.5 9.5V21h13V9.5M9 21v-7h6v7"></path></svg><span>Home</span></button>
        <button data-tab="movies"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M7 5v14M17 5v14M3 9h4M17 9h4M3 15h4M17 15h4"></path></svg><span>Movies</span></button>
        <button data-tab="tv"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"></rect><path d="m8 2 4 4 4-4"></path></svg><span>Series</span></button>
        <button data-tab="list"><span class="plus-icon">+</span><span>My List</span></button>
      </nav>

      <div class="player-modal" id="player-modal" role="dialog" aria-modal="true" aria-label="Video player" hidden>
        <div class="player-topline">
          <div><span>NOW PLAYING</span><strong id="player-title"></strong></div>
          <button type="button" id="close-player" aria-label="Close player">×</button>
        </div>
        <iframe id="player-frame" title="Noctra video player" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen referrerpolicy="origin"></iframe>
      </div>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
